<!-- White Container Card -->
<rect width="1000" height="300" rx="16" fill="#FFFFFF"/>

<!-- App Icon Base (Squircle) -->
<g transform="translate(410, 60)">
  <rect width="180" height="180" rx="40" ry="40" fill="#1E4D68"/>

  <!-- Inner Isotype -->
  <g transform="translate(25, 25)">
    <!-- Hexagon Outer Outline -->
    <path d="M 65,15 L 115,44 L 115,101 L 65,130 L 15,101 L 15,44 Z" fill="none" stroke="#F8F9FA" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Diagonal Line -->
    <line x1="15" y1="101" x2="115" y2="44" stroke="#F8F9FA" stroke-width="8" stroke-linecap="round"/>
    <!-- Ascending 'A' Chevron -->
    <path d="M 28,107 L 65,42 L 102,107" fill="none" stroke="#E07A5F" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</g>
