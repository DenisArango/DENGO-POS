  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const W = %WORDS%, M = %MOODS%, P = %PROPS%, TOTAL = %TOTAL%, EXIT = %EXIT%;

    // life: breath and a slow head sway (finite repeats, all timeline-driven)
    const breaths = Math.floor(TOTAL / 3.2);
    tl.fromTo("#mj-bodywrap", { scaleY: 1, transformOrigin: "50% 100%" }, { scaleY: 1.012, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, breaths * 2 - 1) }, 0);
    tl.fromTo("#mj-all", { rotation: -0.6, transformOrigin: "50% 100%" }, { rotation: 0.6, duration: 2.2, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor(TOTAL / 2.2) - 1) }, 0);
    for (let i = 0, t = 1.8; t < TOTAL - 1; i++, t += 2.9 + ((i * 7) % 5) * 0.37) {
      tl.to(["#mj-eyes", "#mj-eyes-happy"], { scaleY: 0.1, transformOrigin: "50% 50%", duration: 0.06 }, t);
      tl.to(["#mj-eyes", "#mj-eyes-happy"], { scaleY: 1, duration: 0.09 }, t + 0.07);
    }

    // moods
    const MOOD = {
      neutral:    { bl: [0, 0],   br: [0, 0],   eyes: 1, happy: 0, mouth: "smile",   sweat: 0, q: 0, head: 0,  blush: 0.25 },
      happy:      { bl: [-4, -7], br: [4, -7],  eyes: 0, happy: 1, mouth: "big",     sweat: 0, q: 0, head: -3, blush: 0.45 },
      calm:       { bl: [0, -3],  br: [0, -3],  eyes: 0, happy: 1, mouth: "smile",   sweat: 0, q: 0, head: 4,  blush: 0.35 },
      worried:    { bl: [14, -4], br: [-14, -4], eyes: 1, happy: 0, mouth: "worried", sweat: 1, q: 0, head: -4, blush: 0.12 },
      surprised:  { bl: [0, -15], br: [0, -15], eyes: 1, happy: 0, mouth: "o",       sweat: 0, q: 0, head: 0,  blush: 0.25 },
      thinking:   { bl: [0, -11], br: [-7, 2],  eyes: 1, happy: 0, mouth: "side",    sweat: 0, q: 1, head: 5,  blush: 0.25 },
      determined: { bl: [-10, 3], br: [10, 3],  eyes: 1, happy: 0, mouth: "smile",   sweat: 0, q: 0, head: -2, blush: 0.3 },
    };
    const mouths = { smile: "#mj-m-smile", big: "#mj-m-big", worried: "#mj-m-worried", o: "#mj-m-o", side: "#mj-m-side" };
    const d = 0.22;
    M.forEach(([t, name]) => {
      const m = MOOD[name];
      tl.to("#mj-brow-l", { rotation: m.bl[0], y: m.bl[1], transformOrigin: "50% 50%", duration: d, ease: "power2.out" }, t);
      tl.to("#mj-brow-r", { rotation: m.br[0], y: m.br[1], transformOrigin: "50% 50%", duration: d, ease: "power2.out" }, t);
      tl.to("#mj-eyes", { opacity: m.eyes, duration: d }, t);
      tl.to("#mj-eyes-happy", { opacity: m.happy, duration: d }, t);
      Object.entries(mouths).forEach(([k, sel]) => tl.to(sel, { opacity: k === m.mouth ? 1 : 0, duration: d }, t));
      tl.to("#mj-sweat", { opacity: m.sweat, duration: d }, t);
      tl.to("#mj-q", { opacity: m.q, duration: d }, t);
      tl.to("#mj-head", { rotation: m.head, transformOrigin: "50% 80%", duration: 0.45, ease: "back.out(1.6)" }, t);
      tl.to(["#mj-blush-l", "#mj-blush-r"], { opacity: m.blush, duration: d }, t);
    });

    // talking: mouth flaps on every word; the mood mouth returns in pauses
    const spans = [];
    W.forEach(([s, e]) => {
      const last = spans[spans.length - 1];
      if (last && s - last[1] < 0.45) last[1] = e; else spans.push([s, e]);
    });
    spans.forEach(([s, e]) => {
      tl.set("#mj-mbase", { opacity: 0 }, s);
      tl.set("#mj-talk", { opacity: 1 }, s);
      tl.set("#mj-mbase", { opacity: 1 }, e + 0.05);
      tl.set("#mj-talk", { opacity: 0 }, e + 0.05);
    });
    W.forEach(([s, e]) => {
      const half = Math.max(0.05, Math.min(0.12, (e - s) / 2));
      tl.fromTo("#mj-talk", { scaleY: 0.25, transformOrigin: "50% 50%" }, { scaleY: 1, duration: half, ease: "power1.out" }, s);
      tl.to("#mj-talk", { scaleY: 0.3, duration: half, ease: "power1.in" }, s + half);
    });

    // props
    P.forEach(([name, a, z]) => {
      tl.fromTo("#mj-" + name, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, a);
      tl.to("#mj-" + name, { opacity: 0, y: 30, duration: 0.3 }, z);
    });

    // she steps out for the end card
    tl.to("#mj", { y: 720, duration: 0.8, ease: "power3.in" }, EXIT);
    window.__timelines["maria"] = tl;
  </script>
